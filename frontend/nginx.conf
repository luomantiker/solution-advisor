server {
  listen 80;
  # Keep this proxy boundary aligned with SOLUTION_ADVISOR_UPLOAD_MAX_BYTES
  # (256 MiB by default).  Without it Nginx rejects ordinary ONNX models
  # before the API can validate and explain the failure.
  client_max_body_size 256m;
  root /usr/share/nginx/html;
  index index.html;
  # Docker service IPs change on a Compose recreate.  Resolve the service name
  # at request time instead of retaining Nginx's startup-time address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api;
  location /api/ { proxy_pass http://$api_upstream:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
