[project]
name = "solution-advisor"
version = "0.1.0"
description = "Platform-neutral ONNX model analysis service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.9,<1",
    "onnx>=1.16,<2",
    "reportlab>=4.2,<5",
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
]

[project.scripts]
solution-advisor-worker-agent = "solution_advisor.workers.worker_agent:main"
solution-advisor-host-agent-install = "solution_advisor.workers.host_agent_install:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pypdf>=5,<7",
    "fakeredis>=2.26,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=solution_advisor --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
