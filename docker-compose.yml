services:
  api:
    build: .
    expose:
      - "8000"
    env_file: .env.example
    volumes:
      - ./data:/app/data
    environment:
      SOLUTION_ADVISOR_REDIS_URL: redis://redis:6379/0
      SOLUTION_ADVISOR_ENABLE_TEST_IDENTITIES: "true"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  common-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.common-analyzer
    env_file: .env.example
    environment:
      SOLUTION_ADVISOR_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
